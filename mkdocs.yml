site_name: SmartEco
site_description: High-performance, interpretable machine learning systems for production
site_url: https://thatipamula-jashwanth.github.io/SmartEco/

repo_url: https://github.com/thatipamula-jashwanth/SmartEco
repo_name: SmartEco
edit_uri: edit/main/docs/

theme:
  name: material
  language: en

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy
    - toc.integrate
    - content.tabs.link

  palette:
    - scheme: default
      primary: indigo
      accent: blue
    - scheme: slate
      primary: indigo
      accent: blue

  font:
    text: Roboto
    code: Fira Code

plugins:
  - search

extra:
  meta:
    - name: google-site-verification
      content: X0Brwa3ecLdISQ75YpwtnFIhjPI9XOYjnwuIKI3qVwY

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Ecosystem: ecosystem.md

  - Benchmarks:
      - Classification: products/Benchmarks/Classification.md
      - Regression: products/Benchmarks/Regression.md

  - SmartKNN:
      - Overview: products/smartknn/docs/index.md
      - Design Goals: products/smartknn/docs/design-goals.md
      - Core Concepts: products/smartknn/docs/core-concepts.md
      - Architecture: products/smartknn/docs/architecture.md
      - Algorithm Overview: products/smartknn/docs/algorithm-overview.md
      - Feature Weights: products/smartknn/docs/feature-weight-learning.md
      - Distance Engine: products/smartknn/docs/distance-engine.md
      - Backend Strategy: products/smartknn/docs/backend-strategy.md
      - Prediction Logic: products/smartknn/docs/prediction-logic.md
      - Benchmarks: products/smartknn/docs/benchmarks.md
      - sklearn & Production: products/smartknn/docs/sklearn-production.md
      - When to Use / Not Use: products/smartknn/docs/when-to-use.md
      - Limitations: products/smartknn/docs/limitations.md
      - Installation: products/smartknn/docs/installation.md
      - FAQ: products/smartknn/docs/faq.md
      - Versioning: products/smartknn/docs/versioning.md

  - SmartML:
      - Overview: products/smartml/docs/index.md
      - Architecture: products/smartml/docs/architecture.md
      - Usage: products/smartml/docs/usage.md
      - Encoding: products/smartml/docs/encoding.md
      - Splitting: products/smartml/docs/splitting.md
      - Benchmarking: products/smartml/docs/benchmarks.md
      - Models: products/smartml/docs/models.md
      - Limitations: products/smartml/docs/limitations.md
      - FAQ: products/smartml/docs/faq.md

markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
